logging:
  level:
    root: debug
    com.alibaba.nacos: off
    org.springframework.kafka: info

server:
  port: 20001

spring:
  cache:
    type: redis
  data:
    redis:
      password: chuyu@redis123
      timeout: 5s
      cluster:
        nodes: 127.0.0.1:6379, 127.0.0.1:6380, 127.0.0.1:6381
        max-redirects: 3
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      # 这里的数量*实例数=分区数
      concurrency: 3
      type: batch
      ack-mode: manual_immediate

  datasource:
    username: dev
    password: 9fVBpXJqRaFY
    #    url: jdbc:oceanbase://localhost:2881/portal_auth_center?useUnicode=true&characterEncoding=utf-8&useSSL=false&rewriteBatchedStatements=true&allowMultiQueries=true
    #    driver-class-name: com.oceanbase.jdbc.Driver
    url: jdbc:mysql://localhost:3306/portal_auth_center?useUnicode=true&characterEncoding=utf-8&useSSL=false&rewriteBatchedStatements=true&allowMultiQueries=true&timezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 4
      max-active: 20
      min-idle: 4
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      minEvictableIdleTimeMillis: 300000
      maxEvictableIdleTimeMillis: 600000
      test-on-borrow: false
      test-on-return: false
      remove-abandoned: false
      test-while-idle: true
      validation-query: SELECT
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,slf4j
      filter:
        wall:
          enabled: true
          db-type: mysql
          config:
            multi-statement-allow: true

